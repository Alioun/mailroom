# RustCrypto's AES and POLYVAL crates use the ARMv8 Cryptography Extensions on
# aarch64 only behind these flags and fall back to constant-time software
# otherwise. Both backends still detect the CPU feature at runtime. Software
# AES-GCM made decrypting a personal-scale account file (254 MB) take seconds.
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]
